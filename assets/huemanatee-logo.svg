<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <title>Huemanatee Logo</title>
  <desc>A vibrant stylized manatee holding a fountain pen, drawing a cursive loop with a soft drop shadow.</desc>

  <defs>
    <!-- The "Hue" Gradient -->
    <linearGradient id="hue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="50%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#FFCC00" />
    </linearGradient>

    <!-- The Ink Gradient -->
    <linearGradient id="ink-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Ink Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Drop Shadow for the Floating Effect -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Shadow Wrapper applied to everything (static) -->
  <g filter="url(#shadow)">
    
    <!-- Logo Mark Container -->
    <g transform="translate(70, 20)">
      
      <!-- Magical Ink Trail -->
      <path d="M 240 335 C 220 380, 120 360, 150 300 C 180 240, 250 260, 280 320 C 310 380, 420 380, 450 320" 
            fill="none" 
            stroke="url(#ink-grad)" 
            stroke-width="8" 
            stroke-linecap="round" 
            filter="url(#glow)" />

      <!-- Main Manatee Silhouette -->
      <path d="M 100 250 
               C 80 220, 50 230, 50 260 
               C 50 290, 80 300, 100 270 
               C 160 330, 260 340, 330 290 
               C 380 270, 410 270, 410 230 
               C 410 190, 360 180, 320 180 
               C 230 160, 140 180, 100 250 Z" 
            fill="url(#hue-grad)" 
            stroke="#0F172A" 
            stroke-width="6" 
            stroke-linejoin="round" />

      <!-- Cute Snout/Smile Detail -->
      <path d="M 410 250 C 390 250, 380 255, 375 265" 
            fill="none" 
            stroke="#0F172A" 
            stroke-width="4" 
            stroke-linecap="round" />

      <!-- Eye -->
      <circle cx="350" cy="215" r="7" fill="#FFFFFF" />
      <circle cx="352" cy="215" r="3.5" fill="#0F172A" />

      <!-- Fountain Pen -->
      <g transform="translate(260, 300) rotate(30)">
        <path d="M -15 -20 L 15 -20 L 15 0 C 15 10, 5 30, 0 40 C -5 30, -15 10, -15 0 Z" 
              fill="#94A3B8" 
              stroke="#0F172A" 
              stroke-width="4" 
              stroke-linejoin="round" />
        <!-- Nib slit -->
        <path d="M 0 -10 L 0 20" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />
        <!-- Nib breather hole -->
        <circle cx="0" cy="-10" r="3" fill="#0F172A" />
      </g>

      <!-- Front Flipper -->
      <path d="M 280 270 C 290 320, 250 350, 230 330 C 220 310, 250 280, 280 270 Z" 
            fill="url(#hue-grad)" 
            stroke="#0F172A" 
            stroke-width="5" 
            stroke-linejoin="round" />
    </g>

    <!-- Typography -->
    <text x="300" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" text-anchor="middle" letter-spacing="-1.5">
      <tspan fill="url(#hue-grad)">hue</tspan><tspan fill="#0F172A">manatee</tspan>
    </text>
    
    <text x="300" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="6" text-anchor="middle" fill="#64748B">
      REWRITING WITH HUMANITY
    </text>
  </g>
</svg>
